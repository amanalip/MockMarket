name: MockMarket CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint codebase
        run: npm run lint

      - name: Type-check application
        run: npx tsc --noEmit

      - name: Validate committed market data
        run: npm run data:validate

      - name: Run unit test suite
        run: npm run test

      - name: Build production bundle
        env:
          VITE_APP_RELEASE: ${{ github.sha }}
        run: npm run build

      - name: Verify build artifact
        run: |
          test -f dist/index.html || (echo "dist/index.html missing" && exit 1)
          test -f dist/404.html || (echo "dist/404.html missing" && exit 1)
          test -f dist/.nojekyll || (echo "dist/.nojekyll missing" && exit 1)
          grep -q "/MockMarket/assets" dist/index.html || (echo "base path missing /MockMarket/" && exit 1)

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run production E2E suite
        run: npm run test:e2e:only

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Upload tested production bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-dist
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
