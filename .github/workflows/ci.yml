name: MockMarket CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint codebase
        run: npm run lint

      - name: Run unit test suite
        run: npm run test

      - name: Build production bundle
        run: npm run build

      - name: Verify build artifact
        run: |
          test -f dist/index.html || (echo "dist/index.html missing" && exit 1)
          test -f dist/404.html || (echo "dist/404.html missing" && exit 1)
          test -f dist/.nojekyll || (echo "dist/.nojekyll missing" && exit 1)
          echo "Build artifact OK"
