name: Deploy MockMarket to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Verify Pages artifact (SPA fallback + .nojekyll)
        run: |
          ls -lh dist/
          test -f dist/index.html || (echo "dist/index.html missing" && exit 1)
          # SPA fallback for GitHub Pages (deep links) – build script already creates this, keep idempotent
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          echo "Artifact verification:"
          ls -lh dist/*.html dist/.nojekyll
          grep -q "/MockMarket/assets" dist/index.html && echo "base path OK" || (echo "base path missing /MockMarket/" && exit 1)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
